<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ＤＢＣ ｏｐ工具 - 我的待辦</title>
    <link rel="stylesheet" href="common.css">
    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <style>
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .content-card { background: var(--surface); padding: 40px; border-radius: 4px; border: 1px solid var(--border); box-shadow: 0 20px 40px var(--shadow); max-width: 860px; margin: 0 auto; }
        h1 { margin-top: 0; color: var(--text-strong); font-weight: 300; letter-spacing: 2px; font-size: 1.5rem; margin-bottom: 8px; }
        .subtitle { color: var(--muted); font-size: 0.85rem; margin: 0 0 28px; }

        /* 新增列 */
        .add-row { display: flex; gap: 10px; margin-bottom: 26px; flex-wrap: wrap; }
        .add-row input[type="text"] { flex: 1 1 260px; padding: 12px 14px; background: var(--input-bg); border: 1px solid var(--border-strong); color: var(--text-strong); font-size: 1rem; border-radius: 4px; outline: none; }
        .add-row input[type="text"]:focus { border-color: var(--accent); }
        .add-row input[type="date"] { padding: 10px; background: var(--input-bg); border: 1px solid var(--border-strong); color: var(--text-strong); border-radius: 4px; font-family: var(--font-mono); }
        .primary-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 10px 22px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        .primary-btn:hover { background: var(--accent); color: var(--accent-contrast); }

        /* 待辦清單 */
        .todo-list { list-style: none; margin: 0; padding: 0; }
        .todo-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; background: var(--bg); transition: 0.2s; }
        .todo-item:hover { border-color: var(--border-strong); background: var(--surface-2); }
        .todo-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
        .todo-text { flex: 1; min-width: 0; color: var(--text-strong); font-size: 0.98rem; line-height: 1.5; overflow-wrap: anywhere; cursor: text; }
        .todo-text input { width: 100%; box-sizing: border-box; padding: 4px 8px; background: var(--input-bg); border: 1px solid var(--accent); color: var(--text-strong); font-size: 0.98rem; border-radius: 3px; outline: none; }
        .due { flex-shrink: 0; font-family: var(--font-mono); font-size: 0.78rem; padding: 3px 8px; border-radius: 10px; background: var(--surface-3); color: var(--muted); cursor: pointer; white-space: nowrap; }
        .due.today { background: rgba(210,153,34,0.18); color: #d29922; }
        .due.overdue { background: rgba(218,54,51,0.18); color: #da3633; }
        .due-input { flex-shrink: 0; padding: 3px 6px; background: var(--input-bg); border: 1px solid var(--accent); color: var(--text-strong); border-radius: 3px; font-family: var(--font-mono); font-size: 0.8rem; }
        .icon-btn { flex-shrink: 0; background: none; border: none; color: var(--muted-2); font-size: 1.1rem; cursor: pointer; padding: 2px 6px; border-radius: 3px; opacity: 0; transition: 0.15s; }
        .todo-item:hover .icon-btn, .icon-btn:focus { opacity: 1; }
        .icon-btn:hover { color: #da3633; background: var(--surface-3); }
        .todo-item.done .todo-text { color: var(--muted); text-decoration: line-through; }
        .todo-item.done { opacity: 0.75; }
        .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 0.9rem; }

        .done-header { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 10px; color: var(--muted); font-size: 0.88rem; }
        .link-btn { background: none; border: none; color: var(--muted); cursor: pointer; font: inherit; text-decoration: underline; padding: 0; }
        .link-btn:hover { color: var(--accent); }
        .status { margin-top: 18px; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted-2); min-height: 1.2em; }

        /* 分頁 */
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
        .tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 18px; font-size: 0.95rem; cursor: pointer; font-family: var(--font-main); margin-bottom: -1px; }
        .tab:hover { color: var(--text-strong); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: #da3633; color: #fff; font-size: 0.7rem; line-height: 18px; text-align: center; }

        /* 新增交接 */
        .ho-form { border: 1px solid var(--border); border-radius: 4px; padding: 16px; margin-bottom: 22px; background: var(--bg); }
        .ho-form textarea { width: 100%; box-sizing: border-box; min-height: 70px; resize: vertical; padding: 10px 12px; background: var(--input-bg); border: 1px solid var(--border-strong); color: var(--text-strong); border-radius: 4px; font: inherit; font-size: 0.95rem; outline: none; }
        .ho-form textarea:focus { border-color: var(--accent); }
        .ho-form .label { color: var(--muted); font-size: 0.8rem; margin: 12px 0 6px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { border: 1px solid var(--border-strong); background: var(--input-bg); color: var(--text); padding: 5px 12px; border-radius: 16px; cursor: pointer; font-size: 0.85rem; user-select: none; }
        .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
        .ho-form .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
        .ho-form input[type="date"] { padding: 8px; background: var(--input-bg); border: 1px solid var(--border-strong); color: var(--text-strong); border-radius: 4px; font-family: var(--font-mono); }
        .ho-form .row .primary-btn { margin-left: auto; }
        .form-msg { color: #da3633; font-size: 0.82rem; }
        .filters { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }

        /* 手機上刪除鈕常駐顯示 (沒有滑鼠移過的狀態) */
        @media (max-width: 768px) {
            .icon-btn { opacity: 1; }
            .add-row .primary-btn { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <main>
        <div class="content-card">
            <h1>[ 待辦與交接 ]</h1>

            <div class="tabs">
                <button class="tab active" data-tab="todo" onclick="showTab('todo')">我的待辦</button>
                <button class="tab" data-tab="handover" onclick="showTab('handover')">工作交接<span class="count" id="ho-count" hidden></span></button>
            </div>

            <!-- ===== 工作交接 ===== -->
            <div id="pane-handover" hidden>
                <div class="ho-form">
                    <textarea id="ho-text" maxlength="2000" placeholder="交接內容，例如：12/20 龍平團的房控已確認到 A 房，B 房待飯店回覆…"></textarea>
                    <div class="label">交接給誰看（可複選）</div>
                    <div class="chips" id="ho-targets"></div>
                    <div class="row">
                        <span class="label" style="margin:0;">期限</span>
                        <input type="date" id="ho-due">
                        <span class="form-msg" id="ho-msg"></span>
                        <button class="primary-btn" onclick="submitHandover()">[ 送出交接 ]</button>
                    </div>
                </div>
                <div class="filters" id="ho-filters">
                    <span class="chip on" data-filter="incoming">交接給我的</span>
                    <span class="chip" data-filter="outgoing">我發出的</span>
                    <span class="chip" data-filter="done">已完成</span>
                </div>
                <div id="ho-list"></div>
                <div class="status" id="ho-status"></div>
            </div>

            <!-- ===== 我的待辦 ===== -->
            <div id="pane-todo">
            <p class="subtitle">只有你自己看得到這裡的內容。點文字可修改，點日期可改期限。</p>

            <div class="add-row">
                <input type="text" id="new-text" placeholder="新增待辦事項，按 Enter 加入" maxlength="500">
                <input type="date" id="new-due" title="期限 (可不填)">
                <button class="primary-btn" onclick="addTodo()">[ + 新增 ]</button>
            </div>

            <ul class="todo-list" id="open-list"><li class="empty">讀取中...</li></ul>

            <div id="done-section" hidden>
                <div class="done-header">
                    <button class="link-btn" id="toggle-done" onclick="toggleDone()"></button>
                    <button class="link-btn" onclick="clearDone()">清除已完成</button>
                </div>
                <ul class="todo-list" id="done-list" hidden></ul>
            </div>

            <div class="status" id="status"></div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="sidebar.js"></script>
    <script src="handover.js"></script>
    <script>
        // ===== 分頁 (網址加 #handover 直接開工作交接) =====
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            document.getElementById('pane-todo').hidden = tab !== 'todo';
            document.getElementById('pane-handover').hidden = tab !== 'handover';
            history.replaceState(null, '', tab === 'handover' ? '#handover' : '#');
        }
        if (location.hash === '#handover') showTab('handover');

        // ===== 工作交接 =====
        const hoView = Handover.mount(document.getElementById('ho-list'), { filter: 'incoming', statusEl: document.getElementById('ho-status'), emptyText: '目前沒有交接給你的事項' });
        const EMPTY = { incoming: '目前沒有交接給你的事項', outgoing: '你還沒有發出交接', done: '沒有已完成的交接' };
        document.querySelectorAll('#ho-filters .chip').forEach(chip => chip.onclick = () => {
            document.querySelectorAll('#ho-filters .chip').forEach(c => c.classList.toggle('on', c === chip));
            hoView.setFilter(chip.dataset.filter, chip.dataset.filter !== 'done', EMPTY[chip.dataset.filter]);
        });
        hoView.setFilter('incoming', true);

        // 交接對象：「所有人」與個別同事互斥
        const selected = new Set();
        function renderTargets() {
            const chips = [{ email: 'ALL', name: '所有人' }].concat(Handover.users());
            document.getElementById('ho-targets').innerHTML = chips.map(u =>
                `<span class="chip ${selected.has(u.email) ? 'on' : ''}" data-email="${u.email}">${u.name.replace(/[&<>"]/g, '')}</span>`).join('');
            document.querySelectorAll('#ho-targets .chip').forEach(c => c.onclick = () => {
                const email = c.dataset.email;
                if (selected.has(email)) selected.delete(email);
                else { if (email === 'ALL') selected.clear(); else selected.delete('ALL'); selected.add(email); }
                renderTargets();
            });
        }
        // 未讀數 (交接給我的、有新動態)
        Handover.onChange(items => {
            renderTargets();
            const n = items.filter(h => Handover.isIncoming(h) && h.status !== 'done' && Handover.isNew(h)).length;
            const badge = document.getElementById('ho-count');
            badge.hidden = !n;
            badge.textContent = n;
        });
        renderTargets();
        Handover.load();

        function submitHandover() {
            const msg = document.getElementById('ho-msg');
            const text = document.getElementById('ho-text').value.trim();
            if (!text) { msg.textContent = '請輸入交接內容'; return; }
            if (!selected.size) { msg.textContent = '請選擇交接給誰'; return; }
            const due = document.getElementById('ho-due').value.replace(/-/g, '/');
            msg.textContent = '';
            Handover.create({ text, targets: [...selected], due });
            document.getElementById('ho-text').value = '';
            document.getElementById('ho-due').value = '';
            selected.clear();
            renderTargets();
            // 切到「我發出的」看剛送出的交接
            document.querySelector('#ho-filters [data-filter="outgoing"]').click();
        }
    </script>
    <script>
        let items = [];
        let showDone = false;
        const statusEl = document.getElementById('status');
        const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const todayStr = () => { const d = new Date(); return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`; };
        const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);

        // ===== 先存在瀏覽器，再整批同步到雲端 =====
        // LOCAL_KEY：目前的完整清單 (含尚未同步的變更)，登出時清除
        // OUTBOX_KEY：尚未送到雲端的變更，關掉頁面也不會遺失，下次開啟自動補送
        const LOCAL_KEY = 'opCache:todoLocal:' + AUTH.user.email;
        const OUTBOX_KEY = 'opTodoOutbox:' + AUTH.user.email;
        const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
        const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
        let outbox = readJSON(OUTBOX_KEY) || [];
        let syncing = false, flushTimer = null, retryTimer = null;

        function setStatus(cloud) {
            statusEl.textContent = '✓ 已儲存 · ' + (cloud || (outbox.length ? '同步中…' : '已同步到雲端'));
        }

        function applyOp(list, op) {
            if (op.type === 'delete') return list.filter(t => t.id !== op.id);
            const i = list.findIndex(t => t.id === op.item.id);
            if (i >= 0) { list[i] = Object.assign({}, list[i], op.item); return list; }
            return list.concat([Object.assign({ created: '', doneAt: '' }, op.item)]);
        }

        function queueOp(op) {
            outbox.push(op);
            writeJSON(OUTBOX_KEY, outbox);
            writeJSON(LOCAL_KEY, items);
            render();
            setStatus();
            clearTimeout(flushTimer);
            flushTimer = setTimeout(flush, 400);   // 連續操作合併成一次送出
        }

        function flush() {
            if (syncing || !outbox.length) return;
            syncing = true;
            clearTimeout(retryTimer);
            retryTimer = null;
            const batch = outbox.slice();
            fetch(GAS_API.AUTH, { method: 'POST', body: JSON.stringify({ action: 'todoBatch', ops: batch }) })
                .then(r => r.json())
                .then(res => {
                    if (res.status !== 'success') throw new Error(res.message);
                    outbox = outbox.slice(batch.length);
                    writeJSON(OUTBOX_KEY, outbox);
                    // 以雲端資料為準，再疊上同步期間新增的變更
                    items = outbox.reduce(applyOp, res.items);
                    writeJSON(LOCAL_KEY, items);
                    render();
                    setStatus();
                })
                .catch(err => {
                    setStatus('雲端同步失敗，5 秒後自動重試（資料已存在這台電腦）');
                    retryTimer = setTimeout(flush, 5000);
                })
                .then(() => { syncing = false; if (outbox.length && !retryTimer) flush(); });   // 同步期間又有新變更就接著送
        }

        // ===== 讀取：先顯示這台電腦上的清單，再跟雲端對齊 =====
        items = readJSON(LOCAL_KEY) || [];
        render();
        setStatus(outbox.length ? '有尚未同步的變更，同步中…' : '讀取雲端資料…');
        fetch(GAS_API.AUTH, { method: 'POST', body: JSON.stringify({ action: 'todoList' }) })
            .then(r => r.json())
            .then(res => {
                if (res.status !== 'success') { setStatus('雲端讀取失敗：' + res.message); return; }
                if (!syncing) {
                    items = outbox.reduce(applyOp, res.items);
                    writeJSON(LOCAL_KEY, items);
                    render();
                }
                if (outbox.length) flush(); else setStatus();
            })
            .catch(err => setStatus('網路錯誤，暫時只顯示這台電腦上的資料：' + err.message));

        function saveItem(item) { queueOp({ type: 'save', item: { id: item.id, text: item.text, due: item.due, done: !!item.done } }); }

        function addTodo() {
            const input = document.getElementById('new-text');
            const dueInput = document.getElementById('new-due');
            const text = input.value.trim();
            if (!text) { input.focus(); return; }
            const item = { id: newId(), text, due: dueInput.value ? dueInput.value.replace(/-/g, '/') : '', done: false, created: '', doneAt: '' };
            items.push(item);
            input.value = ''; dueInput.value = '';
            input.focus();
            saveItem(item);
        }
        document.getElementById('new-text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) addTodo(); });

        function toggleItem(id) {
            const item = items.find(t => t.id === id);
            item.done = !item.done;
            item.doneAt = item.done ? todayStr() : '';
            saveItem(item);
        }

        function deleteItem(id) {
            items = items.filter(t => t.id !== id);
            queueOp({ type: 'delete', id });
        }

        function clearDone() {
            const doneIds = items.filter(t => t.done).map(t => t.id);
            if (!doneIds.length) return;
            items = items.filter(t => !t.done);
            doneIds.forEach(id => outbox.push({ type: 'delete', id }));
            queueOp(outbox.pop());
        }

        function toggleDone() { showDone = !showDone; render(); }

        // 點文字 → 原地修改
        function editText(id, el) {
            const item = items.find(t => t.id === id);
            el.innerHTML = `<input type="text" maxlength="500" value="${esc(item.text)}">`;
            const input = el.querySelector('input');
            input.focus();
            input.select();
            let finished = false;
            const finish = save => {
                if (finished) return;
                finished = true;
                const text = input.value.trim();
                if (save && text && text !== item.text) { item.text = text; saveItem(item); } else render();
            };
            input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) finish(true); if (e.key === 'Escape') finish(false); });
            input.addEventListener('blur', () => finish(true));
        }

        // 點日期 → 修改期限 (清空即移除期限)
        function editDue(id, el) {
            const item = items.find(t => t.id === id);
            const input = document.createElement('input');
            input.type = 'date';
            input.className = 'due-input';
            input.value = item.due ? item.due.replace(/\//g, '-') : '';
            el.replaceWith(input);
            input.focus();
            let finished = false;
            const finish = () => {
                if (finished) return;
                finished = true;
                const due = input.value ? input.value.replace(/-/g, '/') : '';
                if (due !== item.due) { item.due = due; saveItem(item); } else render();
            };
            input.addEventListener('change', finish);
            input.addEventListener('blur', finish);
        }

        // ===== 畫面 =====
        function dueBadge(t) {
            const today = todayStr();
            if (!t.due) return t.done ? '' : `<span class="due" onclick="editDue('${t.id}', this)" title="設定期限">+ 期限</span>`;
            const cls = t.done ? '' : (t.due < today ? 'overdue' : (t.due === today ? 'today' : ''));
            const label = t.due === today ? '今天' : t.due.slice(5);
            return `<span class="due ${cls}" onclick="editDue('${t.id}', this)" title="期限 ${t.due}${cls === 'overdue' ? '（已過期）' : ''}">${label}</span>`;
        }

        function itemHtml(t) {
            return `<li class="todo-item ${t.done ? 'done' : ''}">
                <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleItem('${t.id}')" aria-label="完成">
                <span class="todo-text" onclick="editText('${t.id}', this)">${esc(t.text)}</span>
                ${dueBadge(t)}
                <button class="icon-btn" onclick="deleteItem('${t.id}')" title="刪除" aria-label="刪除">✕</button>
            </li>`;
        }

        function render() {
            // 未完成：有期限的依日期排在前面，其餘依新增順序
            const open = items.filter(t => !t.done).map((t, i) => ({ t, i }))
                .sort((a, b) => (a.t.due || '9999') < (b.t.due || '9999') ? -1 : (a.t.due || '9999') > (b.t.due || '9999') ? 1 : a.i - b.i)
                .map(x => x.t);
            const done = items.filter(t => t.done).reverse();

            document.getElementById('open-list').innerHTML = open.length
                ? open.map(itemHtml).join('')
                : `<li class="empty">${done.length ? '全部完成了 🎉' : '目前沒有待辦事項，在上方輸入第一件事吧。'}</li>`;

            document.getElementById('done-section').hidden = !done.length;
            document.getElementById('toggle-done').textContent = `${showDone ? '▾' : '▸'} 已完成 (${done.length})`;
            const doneList = document.getElementById('done-list');
            doneList.hidden = !showDone;
            doneList.innerHTML = done.map(itemHtml).join('');
        }
    </script>
</body>
</html>
