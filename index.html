<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ＤＢＣ ｏｐ工具 - 系統總覽</title>
    <link rel="stylesheet" href="common.css">
    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <style>
        /* 右側主視窗 */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .content-card { background: var(--surface); padding: 50px; border-radius: 4px; border: 1px solid var(--border); min-height: 80%; box-shadow: 0 20px 40px var(--shadow); }
        h1 { margin-top: 0; color: var(--text-strong); font-weight: 300; letter-spacing: 2px; font-size: 1.5rem; margin-bottom: 30px; }
        .terminal-box { background: var(--input-bg); border: 1px solid var(--border); padding: 20px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); line-height: 1.6; margin-bottom: 30px; }
        .terminal-box span.highlight { color: var(--accent); }

        /* 查詢區塊 */
        .search-bar { display: flex; gap: 15px; align-items: center; margin-bottom: 30px; }
        input[type="date"] { padding: 10px 15px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-strong); font-size: 0.95rem; border-radius: 2px; font-family: var(--font-mono); outline: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: var(--icon-filter); cursor: pointer; }
        input[type="date"]:focus { border-color: var(--accent); }
        
        .primary-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 10px 25px; border-radius: 2px; font-family: var(--font-mono); font-size: 0.9rem; cursor: pointer; transition: all 0.2s; letter-spacing: 1px; }
        .primary-btn:hover { background: var(--accent); color: var(--accent-contrast); }
        .primary-btn:disabled { border-color: var(--border-strong); color: var(--muted); cursor: not-allowed; background: transparent; }

        /* 完美還原 Excel 的表格樣式 */
        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; }
        table { width: max-content; border-collapse: collapse; font-size: 0.85rem; font-weight: 700; font-family: var(--font-main); background: var(--bg); }
        th, td { border: 1px solid var(--border); padding: 10px 15px; text-align: right; white-space: nowrap; color: var(--text-strong); }

        /* 各區塊的項目名稱欄 (行程 / 課程 / 同業專案) 靠左對齊 */
        .col-label { text-align: left; color: var(--accent); background: var(--surface); }
        td:first-child, th:first-child { position: sticky; left: 0; z-index: 1; }

        /* 日期列 (Row 1) */
        .row-date th { background: var(--surface-2); color: var(--text-strong); text-align: center; font-size: 0.9rem; letter-spacing: 1px; }

        /* 標題列 (Row 2) */
        .row-header th { background: var(--surface-3); color: var(--text-strong); text-align: center; }
        .row-header th.col-label { color: var(--accent); }

        /* 黑色分隔列 (Spacer Row) */
        .row-spacer td { background: var(--input-bg) !important; color: var(--input-bg) !important; height: 10px; padding: 0; border: none; }

        /* 空白分隔欄 (Spacer Column) */
        .col-spacer { background: var(--input-bg) !important; min-width: 20px; border-top: none; border-bottom: none; }

        /* 總計列 (Grand Total) */
        .row-grand-total td { background: var(--surface-2); color: var(--text-strong); border-top: 2px solid var(--accent); }
        .row-grand-total td.col-label { color: var(--accent); }

        tr:hover td:not(.col-spacer):not(.row-spacer td) { background: var(--surface-3); }

        /* 報表圖片按鈕 (查到資料後才出現) */
        .report-actions { display: flex; gap: 10px; margin-left: auto; }
        .report-actions[hidden] { display: none; }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <main>
        <div class="content-card">
            <h1>[ 系統總覽 - 每日人數查詢 ]</h1>
            
            <div class="terminal-box" id="sys-log">
                > 系統核心模組已載入。<br>
                > 請選擇日期，以查詢當日各行程之出團人數統計。
            </div>

            <div class="search-bar">
                <input type="date" id="query-date">
                <button class="primary-btn" id="btn-query" onclick="queryAttendance()">[ 執行查詢 ]</button>
                <div class="report-actions" id="report-actions" hidden>
                    <button class="primary-btn" onclick="exportReportImage('copy')">[ 複製報表圖片 ]</button>
                    <button class="primary-btn" onclick="exportReportImage('download')">[ 下載圖片 ]</button>
                </div>
            </div>

            <div class="table-container">
                <table id="result-table">
                    <tbody id="result-body">
                        <tr><td style="text-align: center; color: var(--muted); padding: 30px;">[ 請選擇日期並點擊查詢 ]</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="sidebar.js"></script>
    <script>
        const GAS_API_URL = GAS_API.ATTENDANCE; // 網址設定在 config.js

        window.onload = () => {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('query-date').value = `${yyyy}-${mm}-${dd}`;
        };

        function queryAttendance() {
            const dateVal = document.getElementById('query-date').value;
            if (!dateVal) return alert("請選擇日期");

            const formattedDate = dateVal.replace(/-/g, '/');
            const btn = document.getElementById('btn-query');
            const tbody = document.getElementById('result-body');
            const log = document.getElementById('sys-log');

            btn.innerText = "[ 查詢中... ]";
            btn.disabled = true;
            tbody.innerHTML = '<tr><td style="text-align: center; color: var(--muted); padding: 30px;">[ 正在向伺服器請求資料... ]</td></tr>';

            // 同一天查過的話先顯示上次結果，再向伺服器確認最新資料
            fetchWithCache(GAS_API_URL, { action: "getAttendanceByDate", date: formattedDate }, (res, meta) => {
                if (res.status === 'success') {
                    log.innerHTML = meta.fromCache
                        ? `> 先顯示上次查詢 ${formattedDate} 的結果，正在更新...`
                        : `> 查詢成功：${formattedDate}<br>> 已載入原始報表格式。`;
                    renderExactTable(res.data);
                } else {
                    log.innerHTML = `> <span style="color: #da3633">查詢失敗：${res.message}</span>`;
                    tbody.innerHTML = `<tr><td style="text-align: center; color: #da3633; padding: 30px;">[ ${res.message} ]</td></tr>`;
                }
            })
            .then(result => {
                btn.innerText = "[ 執行查詢 ]";
                btn.disabled = false;
                if (!result.updated) log.innerHTML = `> 查詢成功：${formattedDate}（已是最新資料）<br>> 已載入原始報表格式。`;
            })
            .catch(err => {
                btn.innerText = "[ 執行查詢 ]";
                btn.disabled = false;
                log.innerHTML = `> <span style="color: #da3633">網路錯誤：${err.message}</span>`;
                tbody.innerHTML = '<tr><td style="text-align: center; color: #da3633; padding: 30px;">[ 網路連線異常 ]</td></tr>';
            });
        }

        // 完美還原 Excel 2D 陣列的渲染函數
        function renderExactTable(matrix) {
            const tbody = document.getElementById('result-body');
            tbody.innerHTML = '';
            document.getElementById('report-actions').hidden = !(matrix && matrix.length);

            if (!matrix || matrix.length === 0) {
                tbody.innerHTML = '<tr><td style="text-align: center; color: var(--muted); padding: 30px;">[ 該日無出團紀錄或尚未匯入資料 ]</td></tr>';
                return;
            }

            // 找出空白分隔欄：表頭列空白的欄位 (行程 / 課程 / 同業專案 各區塊之間，最多兩欄)
            const spacerCols = new Set();
            if (matrix[1]) matrix[1].forEach((cell, i) => { if (i > 0 && cell === "") spacerCols.add(i); });
            // 各區塊的項目名稱欄：第一欄與每個分隔欄的下一欄
            const labelCols = new Set([0]);
            spacerCols.forEach(i => labelCols.add(i + 1));

            matrix.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');

                // 判斷列的樣式
                if (rowIndex === 0) tr.className = 'row-date';
                else if (rowIndex === 1) tr.className = 'row-header';
                else if (rowIndex === matrix.length - 1) tr.className = 'row-grand-total';
                else if (row[0] === "") tr.className = 'row-spacer'; // 第一格是空的代表是黑色分隔列

                row.forEach((cell, colIndex) => {
                    const td = document.createElement(rowIndex <= 1 ? 'th' : 'td');

                    // 處理合併儲存格 (日期列)
                    if (rowIndex === 0) {
                        if (spacerCols.has(colIndex)) {
                            td.className = 'col-spacer';
                            tr.appendChild(td);
                        } else if (cell !== "") {
                            // 計算要跨幾欄 (直到遇到下一個有值的格子、分隔欄或陣列結束)
                            let colspan = 1;
                            for (let i = colIndex + 1; i < row.length; i++) {
                                if (row[i] === "" && !spacerCols.has(i)) colspan++;
                                else break;
                            }
                            td.colSpan = colspan;
                            td.innerText = cell;
                            tr.appendChild(td);
                        }
                    } else {
                        td.innerText = cell;
                        // 套用空白分隔欄樣式
                        if (spacerCols.has(colIndex)) {
                            td.className = 'col-spacer';
                            td.innerText = ''; // 清空內容
                        } else if (labelCols.has(colIndex)) {
                            td.className = 'col-label';
                        }
                        tr.appendChild(td);
                    }
                });
                tbody.appendChild(tr);
            });
        }

        // 把報表表格轉成圖片：copy 複製到剪貼簿 (可直接貼到 LINE)，download 下載 PNG
        function exportReportImage(mode) {
            const log = document.getElementById('sys-log');
            const load = window.html2canvas ? Promise.resolve() : new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                s.onload = resolve;
                s.onerror = () => reject(new Error('圖片工具載入失敗，請檢查網路'));
                document.head.appendChild(s);
            });
            log.innerHTML = '> 正在產生報表圖片...';
            load.then(() => html2canvas(document.getElementById('result-table'), {
                scale: 2,
                backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#050505'
            }))
            .then(canvas => new Promise(resolve => canvas.toBlob(resolve, 'image/png')))
            .then(blob => {
                const date = document.getElementById('query-date').value;
                if (mode === 'copy' && navigator.clipboard && window.ClipboardItem) {
                    return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                        .then(() => { log.innerHTML = '> <span class="highlight">報表圖片已複製！可以直接到 LINE 或訊息視窗按 Ctrl + V 貼上。</span>'; });
                }
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `人數回報_${date}.png`;
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 10000);
                log.innerHTML = `> <span class="highlight">已下載 ${a.download}</span>`;
            })
            .catch(err => { log.innerHTML = `> <span style="color: #da3633">產生圖片失敗：${err.message}</span>`; });
        }
    </script>
</body>
</html>
