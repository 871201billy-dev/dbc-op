<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ＤＢＣ ｏｐ工具 - 系統總覽</title>
    <link rel="stylesheet" href="common.css">
    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <style>
        /* 右側主視窗 */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .content-card { background: var(--surface); padding: 50px; border-radius: 4px; border: 1px solid var(--border); min-height: 80%; box-shadow: 0 20px 40px var(--shadow); }
        h1 { margin-top: 0; color: var(--text-strong); font-weight: 300; letter-spacing: 2px; font-size: 1.5rem; margin-bottom: 30px; }
        .terminal-box { background: var(--input-bg); border: 1px solid var(--border); padding: 20px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); line-height: 1.6; margin-bottom: 30px; }
        .terminal-box span.highlight { color: var(--accent); }

        /* 查詢區塊 */
        .search-bar { display: flex; gap: 15px; align-items: center; margin-bottom: 30px; }
        input[type="date"] { padding: 10px 15px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-strong); font-size: 0.95rem; border-radius: 2px; font-family: var(--font-mono); outline: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: var(--icon-filter); cursor: pointer; }
        input[type="date"]:focus { border-color: var(--accent); }
        
        .primary-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 10px 25px; border-radius: 2px; font-family: var(--font-mono); font-size: 0.9rem; cursor: pointer; transition: all 0.2s; letter-spacing: 1px; }
        .primary-btn:hover { background: var(--accent); color: var(--accent-contrast); }
        .primary-btn:disabled { border-color: var(--border-strong); color: var(--muted); cursor: not-allowed; background: transparent; }

        /* 完美還原 Excel 的表格樣式 */
        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; }
        table { width: max-content; border-collapse: collapse; font-size: 0.85rem; font-family: var(--font-main); background: var(--bg); }
        th, td { border: 1px solid var(--border); padding: 10px 15px; text-align: right; white-space: nowrap; }
        
        /* 第一欄 (項目名稱) 靠左對齊 */
        td:first-child, th:first-child { text-align: left; font-weight: bold; color: var(--accent); background: var(--surface); position: sticky; left: 0; z-index: 1; }
        
        /* 日期列 (Row 1) */
        .row-date th { background: var(--surface-2); color: var(--text-strong); text-align: center; font-size: 0.9rem; letter-spacing: 1px; }
        
        /* 標題列 (Row 2) */
        .row-header th { background: var(--surface-3); color: var(--muted); font-weight: normal; text-align: center; }
        
        /* 黑色分隔列 (Spacer Row) */
        .row-spacer td { background: var(--input-bg) !important; color: var(--input-bg) !important; height: 10px; padding: 0; border: none; }
        
        /* 空白分隔欄 (Spacer Column) */
        .col-spacer { background: var(--input-bg) !important; min-width: 20px; border-top: none; border-bottom: none; }
        
        /* 總計列 (Grand Total) */
        .row-grand-total td { background: var(--surface-2); color: var(--text-strong); font-weight: bold; border-top: 2px solid var(--accent); }
        
        tr:hover td:not(.col-spacer):not(.row-spacer td) { background: var(--surface-3); }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <main>
        <div class="content-card">
            <h1>[ 系統總覽 - 每日人數查詢 ]</h1>
            
            <div class="terminal-box" id="sys-log">
                > 系統核心模組已載入。<br>
                > 請選擇日期，以查詢當日各行程之出團人數統計。
            </div>

            <div class="search-bar">
                <input type="date" id="query-date">
                <button class="primary-btn" id="btn-query" onclick="queryAttendance()">[ 執行查詢 ]</button>
            </div>

            <div class="table-container">
                <table id="result-table">
                    <tbody id="result-body">
                        <tr><td style="text-align: center; color: var(--muted); padding: 30px;">[ 請選擇日期並點擊查詢 ]</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="sidebar.js"></script>
    <script>
        const GAS_API_URL = GAS_API.ATTENDANCE; // 網址設定在 config.js

        window.onload = () => {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('query-date').value = `${yyyy}-${mm}-${dd}`;
        };

        function queryAttendance() {
            const dateVal = document.getElementById('query-date').value;
            if (!dateVal) return alert("請選擇日期");

            const formattedDate = dateVal.replace(/-/g, '/');
            const btn = document.getElementById('btn-query');
            const tbody = document.getElementById('result-body');
            const log = document.getElementById('sys-log');

            btn.innerText = "[ 查詢中... ]";
            btn.disabled = true;
            tbody.innerHTML = '<tr><td style="text-align: center; color: var(--muted); padding: 30px;">[ 正在向伺服器請求資料... ]</td></tr>';

            // 同一天查過的話先顯示上次結果，再向伺服器確認最新資料
            fetchWithCache(GAS_API_URL, { action: "getAttendanceByDate", date: formattedDate }, (res, meta) => {
                if (res.status === 'success') {
                    log.innerHTML = meta.fromCache
                        ? `> 先顯示上次查詢 ${formattedDate} 的結果，正在更新...`
                        : `> 查詢成功：${formattedDate}<br>> 已載入原始報表格式。`;
                    renderExactTable(res.data);
                } else {
                    log.innerHTML = `> <span style="color: #da3633">查詢失敗：${res.message}</span>`;
                    tbody.innerHTML = `<tr><td style="text-align: center; color: #da3633; padding: 30px;">[ ${res.message} ]</td></tr>`;
                }
            })
            .then(result => {
                btn.innerText = "[ 執行查詢 ]";
                btn.disabled = false;
                if (!result.updated) log.innerHTML = `> 查詢成功：${formattedDate}（已是最新資料）<br>> 已載入原始報表格式。`;
            })
            .catch(err => {
                btn.innerText = "[ 執行查詢 ]";
                btn.disabled = false;
                log.innerHTML = `> <span style="color: #da3633">網路錯誤：${err.message}</span>`;
                tbody.innerHTML = '<tr><td style="text-align: center; color: #da3633; padding: 30px;">[ 網路連線異常 ]</td></tr>';
            });
        }

        // 完美還原 Excel 2D 陣列的渲染函數
        function renderExactTable(matrix) {
            const tbody = document.getElementById('result-body');
            tbody.innerHTML = '';
            
            if (!matrix || matrix.length === 0) {
                tbody.innerHTML = '<tr><td style="text-align: center; color: var(--muted); padding: 30px;">[ 該日無出團紀錄或尚未匯入資料 ]</td></tr>';
                return;
            }

            // 找出哪一欄是空白分隔欄 (通常在 "課程" 的前一欄)
            let spacerColIndex = -1;
            if (matrix[1]) {
                spacerColIndex = matrix[1].findIndex(cell => cell === "");
            }

            matrix.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                
                // 判斷列的樣式
                if (rowIndex === 0) tr.className = 'row-date';
                else if (rowIndex === 1) tr.className = 'row-header';
                else if (rowIndex === matrix.length - 1) tr.className = 'row-grand-total';
                else if (row[0] === "") tr.className = 'row-spacer'; // 第一格是空的代表是黑色分隔列

                row.forEach((cell, colIndex) => {
                    const td = document.createElement(rowIndex <= 1 ? 'th' : 'td');
                    
                    // 處理合併儲存格 (日期列)
                    if (rowIndex === 0) {
                        if (cell !== "") {
                            // 計算要跨幾欄 (直到遇到下一個有值的格子或陣列結束)
                            let colspan = 1;
                            for (let i = colIndex + 1; i < row.length; i++) {
                                if (row[i] === "") colspan++;
                                else break;
                            }
                            td.colSpan = colspan;
                            td.innerText = cell;
                            tr.appendChild(td);
                        }
                    } else {
                        td.innerText = cell;
                        // 套用空白分隔欄樣式
                        if (colIndex === spacerColIndex) {
                            td.className = 'col-spacer';
                            td.innerText = ''; // 清空內容
                        }
                        tr.appendChild(td);
                    }
                });
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
